<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="icon" type="image/x-icon" href="/src/img/velha.png">
    <title>Jogo da Velha</title>
</head>
<body>
    <div id="Home">
        <div class="home-container">
            <div class="title-with-icon">
                <div class="icon-container-home">
                    <img src="/src/img/velha.png" alt="Avó" class="game-icon-home" title="Ícone da Avó">
                </div>
                <h1>Jogo da Velha</h1>
                <div class="icon-container-home">
                    <img src="/src/img/velha.png" alt="Avó" class="game-icon-home" title="Ícone da Avó">
                </div>
            </div>
            
            <div class="players-shadow-box">
                <h2>Jogadores</h2>
                <div class="input-group">
                    <input type="text" id="player1" placeholder="Nome do Jogador 1">
                    <input type="text" id="player2" placeholder="Nome do Jogador 2">
                </div>
                <button id="startButton" class="btn btn-primary">Iniciar Jogo</button>
            </div>
        </div>
    </div>

    <!-- GAME SECTION -->
    <div id="Game">
        <div class="game-container">
            <h2>Tabuleiro do Jogo</h2>
            <div id="board">
                <div class="celula" data-pos="A1"></div>
                <div class="celula" data-pos="A2"></div>
                <div class="celula" data-pos="A3"></div>
                <div class="celula" data-pos="B1"></div>
                <div class="celula" data-pos="B2"></div>
                <div class="celula" data-pos="B3"></div>
                <div class="celula" data-pos="C1"></div>
                <div class="celula" data-pos="C2"></div>
                <div class="celula" data-pos="C3"></div>
            </div>

            <div class="reset-container">
                <button id="reset" class="btn btn-primary">Reiniciar Jogo</button>
                <button id="verHistorico" class="btn btn-primary">Ver Histórico</button>
            </div>
        </div>
    </div>

    <!-- HISTORY SECTION -->
    <div id="Storage">
        <h2>📊 Histórico de Partidas</h2>
        <table id="tableStorage">
            <thead>
                <tr>
                    <th>Partida</th>
                    <th>Vencedor</th>
                    <th>Duração</th>
                </tr>
            </thead>
            <tbody id="bodyTable"></tbody>
        </table>
        <button id="backToGame" class="btn btn-primary">Voltar ao Jogo</button>
    </div>

    <script src="/src/js/main.js"></script>
</body>
</html>
